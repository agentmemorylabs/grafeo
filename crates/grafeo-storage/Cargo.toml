[package]
name = "grafeo-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Persistence layer for Grafeo: WAL, container format, section I/O"

[dependencies]
grafeo-common.workspace = true

# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true
bincode.workspace = true
bytes.workspace = true
byteorder.workspace = true

# Concurrency
parking_lot.workspace = true
crossbeam = { workspace = true, optional = true }

# Checksums (always needed for section directory CRC)
crc32fast.workspace = true

# Hashing (streaming SHA-256 for generation validation; the additive
# GenerationFileOps seam lives at the grafeo-file level)
sha2.workspace = true

# I/O (optional, feature-gated)
memmap2 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }

# Async (optional)
tokio = { workspace = true, optional = true }

# Tracing (optional, zero-cost when disabled)
tracing = { workspace = true, optional = true }

# Core graph types (optional, for generation adapter)
grafeo-core = { workspace = true, default-features = false, optional = true, features = ["compact-store", "lpg"] }

# Correlation IDs for unpublished build dirs (generation lifecycle)
rand = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# FD_CLOEXEC for the root lock handle (W0-B lock module)
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"
criterion.workspace = true

[[bench]]
name = "wal_bench"
harness = false
required-features = ["wal"]

[[bench]]
name = "generation_build_bench"
harness = false
required-features = ["generation"]

[features]
default = ["wal"]
wal = ["memmap2", "tokio", "crossbeam"]
async-storage = ["wal"]
grafeo-file = ["wal", "fs2"]
generation = ["grafeo-file", "dep:grafeo-core", "dep:rand"]
tracing = ["dep:tracing", "grafeo-common/tracing"]
testing-crash-injection = ["grafeo-common/testing-crash-injection"]
encryption = ["grafeo-common/encryption"]

[lints]
workspace = true
