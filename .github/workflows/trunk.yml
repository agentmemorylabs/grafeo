name: Trunk

# Trimmed CI for the fork's real trunk. ci.yml only triggers on main and
# release/*, and its full matrix (3 OSes, language bindings, miri, coverage,
# benchmarks) is too large for a fork-trunk gate. This builds and tests only
# the feature sets this fork actually uses.

on:
  push:
    branches: [fix/root-mount-covers-nested]
  pull_request:
    branches: [fix/root-mount-covers-nested]
  workflow_dispatch:

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # No debuginfo: keeps target/ small on the hosted runner. TEST is needed too,
  # since cargo test builds with the test profile. Side effect: panic
  # backtraces have no line numbers.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Matches the feature set agent-memory-hosted builds Grafeo with.
  FEATURES: lpg,cypher,vector-index,text-index,wal,grafeo-file,mmap,parallel,compact-store,generation,generation-streaming,triple-store,tracing

jobs:
  trunk:
    name: Build and test (trunk feature set)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      # The library itself, with exactly the feature set AMH builds.
      - name: Build
        run: cargo build -p grafeo-engine --features "$FEATURES"

      # Each lib-test step runs even if an earlier one failed, so one run
      # shows every compile error.
      - name: Common lib tests
        if: ${{ !cancelled() }}
        run: cargo test -p grafeo-common --tests

      # --tests (not --lib alone) also runs the integration targets, e.g.
      # transactional_batch and rdf_tests (needs triple-store).
      - name: Core lib and integration tests
        if: ${{ !cancelled() }}
        run: cargo test -p grafeo-core --tests --features "lpg,mmap,compact-store,generation-streaming,vector-index,text-index,triple-store"

      # Includes golden_wal_frames and golden_grafeo_file.
      - name: Storage lib and integration tests
        if: ${{ !cancelled() }}
        run: cargo test -p grafeo-storage --tests --features "wal,grafeo-file,generation,generation-streaming,tracing"

      - name: Engine lib tests
        if: ${{ !cancelled() }}
        run: cargo test -p grafeo-engine --lib --features "$FEATURES"

      # Every engine integration target runs, except the named exceptions below.
      # A skip-list (not an allow-list) so new tests are picked up automatically,
      # and every target is compiled, so one that stops compiling fails CI.
      # --no-fail-fast so one failing target does not hide the rest.
      - name: Engine integration tests (all targets except named exceptions)
        if: ${{ !cancelled() }}
        run: |
          set -eu
          # compact_store_generation_contract: cannot compile with generation-streaming
          #   (imports the eager generate_compact_store, which that feature seals as
          #   pub(crate)). Runs in the "no-streaming" job below instead.
          # crash_atomic_checkpoint, crash_injection_single_file,
          # layered_rollback_base_mutations, layered_session_direct_api,
          # wal_conflict_poison_window, wal_interleaved_transactions,
          # wal_rdf_group_failures: contain tests gated on testing-crash-injection
          #   (all of wal_conflict_poison_window, wal_rdf_group_failures), so they
          #   run in the next step with it on. Keep both lists in sync.
          # n_vs_4n_peak_memory: asserts a 128 MiB peak RssAnon budget, which a debug
          #   build exceeds on the hosted runner (143628 kB before fork #24). It runs
          #   in the "peak-memory-release" job below, where it fits since #24.
          skip='^(compact_store_generation_contract|crash_atomic_checkpoint|crash_injection_single_file|layered_rollback_base_mutations|layered_session_direct_api|wal_conflict_poison_window|wal_interleaved_transactions|wal_rdf_group_failures|n_vs_4n_peak_memory)$'
          targets=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="grafeo-engine") | .targets[]
                     | select(.kind | index("test")) | .name' \
            | grep -Ev "$skip" | sed 's/^/--test /' | tr '\n' ' ')
          echo "targets: $targets"
          cargo test -p grafeo-engine --features "$FEATURES" --no-fail-fast $targets

      # Every engine target with tests gated on testing-crash-injection, run once
      # here with it (and sparql, for wal_rdf_group_failures) on. Kept separate so
      # the injection hooks are only compiled in for these targets.
      - name: Engine crash-injection tests
        if: ${{ !cancelled() }}
        run: cargo test -p grafeo-engine --features "$FEATURES,testing-crash-injection,sparql" --no-fail-fast --test crash_atomic_checkpoint --test crash_injection_single_file --test layered_rollback_base_mutations --test layered_session_direct_api --test wal_conflict_poison_window --test wal_interleaved_transactions --test wal_rdf_group_failures

  no-streaming:
    name: compact_store_generation_contract (without generation-streaming)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-streaming
      - name: Run the eager-path contract test
        run: cargo test -p grafeo-engine --features "generation,compact-store,lpg,wal,mmap" --test compact_store_generation_contract

  peak-memory-release:
    name: n_vs_4n_peak_memory (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: peak-memory-release
      - name: Run the peak-memory acceptance test in release
        run: cargo test --release -p grafeo-engine --features "$FEATURES" --test n_vs_4n_peak_memory
